# CI for the backend. NOTE: this file must live at the repository root
# (.github/workflows/) — GitHub Actions ignores workflow files in
# subdirectories, which is why the old backend/.github copy never ran.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bp
          POSTGRES_PASSWORD: bp_test
          POSTGRES_DB: borderless
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bp -d borderless"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install optional deps (pg driver)
        run: npm install
      - name: Syntax check
        run: for f in src/*.js test/*.js; do node --check "$f"; done
      - name: Run tests (incl. Postgres persistence)
        env:
          BP_PG_TEST_URL: postgres://bp:bp_test@127.0.0.1:5432/borderless
        run: node --test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t borderless-pay:ci backend
      - name: Smoke test container
        run: |
          docker run -d --name bp -p 4000:4000 \
            -e BP_ENV=production \
            -e BP_SIGNING_SECRET=ci-signing-secret-not-for-prod \
            -e BP_ENC_KEY=$(openssl rand -hex 32) \
            borderless-pay:ci
          sleep 3
          curl -fsS http://localhost:4000/api/health
          docker rm -f bp
